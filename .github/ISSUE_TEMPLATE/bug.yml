name: Bug report
description: Something behaves differently from its contract or documentation
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or CLI commands. Fake adapters or scenarios preferred.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Output of `air trace explain <command-id>`, relevant ledger entries (`air ledger log --json`), or test output. Remove secrets.
  - type: input
    id: version
    attributes:
      label: AIR version or commit
    validations:
      required: true
  - type: checkboxes
    id: physical
    attributes:
      label: Physical impact
      options:
        - label: This could cause unsafe or unauthorized robot motion. If so, STOP and report it privately via SECURITY.md instead.
