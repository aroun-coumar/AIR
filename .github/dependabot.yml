version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The core has no runtime dependencies; this covers dev tooling.
    groups:
      dev-tools:
        patterns: ["*"]
