name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      # Actions are pinned by full commit SHA (Scorecard: Pinned-Dependencies);
      # Dependabot proposes updates as reviewable PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Lint and type-check
        shell: bash
        run: |
          BIN=.venv/bin; [ -d .venv/Scripts ] && BIN=.venv/Scripts
          $BIN/ruff check src tests examples
          $BIN/mypy
      - name: Contract schemas are current and backwards compatible
        shell: bash
        run: |
          BIN=.venv/bin; [ -d .venv/Scripts ] && BIN=.venv/Scripts
          $BIN/air schema check
      - name: Tests with requirement evidence
        shell: bash
        run: |
          BIN=.venv/bin; [ -d .venv/Scripts ] && BIN=.venv/Scripts
          $BIN/python -m pytest -q --air-evidence .air/test-evidence.json
      - name: Traceability and ledger integrity
        shell: bash
        run: |
          BIN=.venv/bin; [ -d .venv/Scripts ] && BIN=.venv/Scripts
          $BIN/air ledger verify
          $BIN/air requirements matrix --check --out traceability.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: traceability
          path: |
            traceability.md
            .air/test-evidence.json
