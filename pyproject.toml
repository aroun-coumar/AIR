[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-robotics"
version = "0.1.0.dev0"
description = "A reusable framework for building agentic robotic systems: typed execution contracts, runtime admission, authority, and evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Agentic Robotics Framework maintainers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The minimal core has no third-party runtime dependencies (baseline section 5).
dependencies = []

[project.optional-dependencies]
# Claude models via the official Anthropic SDK. Local/open models need no extra.
anthropic = ["anthropic>=2.1"]
# Optuna as a sampler for engineering.search (AIR stays the system of record).
optuna = ["optuna>=3.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23",
       "anthropic>=2.1"]

[project.scripts]
air = "agentic_robotics.cli:main"
agentic-robotics = "agentic_robotics.cli:main"

# Requirement evidence from test runs; inert unless --air-evidence is passed.
[project.entry-points.pytest11]
air = "agentic_robotics.testing.pytest_plugin"

# Third-party adapters register themselves here; see agentic_robotics.plugins.
[project.entry-points."agentic_robotics.adapters"]
fake = "agentic_robotics.integrations.fake:FakeRobotAdapter"
fake_arm = "agentic_robotics.integrations.fake_arm:FakeArmAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_robotics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
