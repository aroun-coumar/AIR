[build-system]
# 1.27 is the first hatchling with PEP 639 license expressions.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI (`pip install airobotics`); the import name stays
# `agentic_robotics` and the CLI stays `air` (alias `airobotics`).
name = "airobotics"
dynamic = ["version"]
description = "AIR: the runtime between the model and the motors. Verified robot execution, multi-robot coordination, provable evidence and agent-run engineering work, with a dependency-free core."
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AIR maintainers" }]
maintainers = [{ name = "aroun-coumar" }]
keywords = ["robotics", "agents", "llm", "multi-robot", "fleet", "provenance", "safety",
            "verification", "ros2", "vda5050", "mcp", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# The minimal core has no third-party runtime dependencies (baseline section 5).
dependencies = []

[project.optional-dependencies]
# Claude models via the official Anthropic SDK. Local/open models need no extra.
anthropic = ["anthropic>=2.1"]
# Optuna as a sampler for engineering.search (AIR stays the system of record).
optuna = ["optuna>=3.6"]
# Ed25519 signing of release metadata, ledger checkpoints and DSSE attestations.
# Verification and HMAC signing work without it.
signing = ["cryptography>=42"]
# Ecosystem bridges (ADR 0019); each is imported lazily by its integration only.
# Unitree's unitree_sdk2py is not on PyPI and rclpy comes from a ROS 2 distribution.
piper = ["piper_sdk>=0.6"]
vda5050 = ["paho-mqtt>=2.0"]
openpi = ["websockets>=13"]
dora = ["dora-rs>=1.0"]
lerobot = ["lerobot>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23",
       "anthropic>=2.1"]

[project.urls]
Homepage = "https://github.com/aroun-coumar/AIR"
Repository = "https://github.com/aroun-coumar/AIR"
Documentation = "https://github.com/aroun-coumar/AIR#readme"
Issues = "https://github.com/aroun-coumar/AIR/issues"
Changelog = "https://github.com/aroun-coumar/AIR/tree/main/changelog.d"

[project.scripts]
air = "agentic_robotics.cli:main"
# Alias: another PyPI project (`air`, a web framework) may also install an `air` command.
airobotics = "agentic_robotics.cli:main"
agentic-robotics = "agentic_robotics.cli:main"

# Requirement evidence from test runs; inert unless --air-evidence is passed.
[project.entry-points.pytest11]
air = "agentic_robotics.testing.pytest_plugin"

# Third-party adapters register themselves here; see agentic_robotics.plugins.
[project.entry-points."agentic_robotics.adapters"]
fake = "agentic_robotics.integrations.fake:FakeRobotAdapter"
fake_arm = "agentic_robotics.integrations.fake_arm:FakeArmAdapter"

[tool.hatch.version]
path = "src/agentic_robotics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_robotics"]

# The source distribution is what downstream packagers rebuild from: code, tests,
# examples, schemas and public docs; never the project's own ledger or CI config.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/schemas", "/docs", "/changelog.d",
           "/README.md", "/README.pypi.md", "/LICENSE", "/SECURITY.md",
           "/QUALITY_DECLARATION.md", "/RELEASING.md", "/towncrier.toml"]
exclude = ["/docs/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
